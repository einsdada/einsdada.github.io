<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>einsdada · 博客</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E7C86'/%3E%3Cpath d='M18 20h8v24h-8zM26 32l14 12h-8l-10-9zM38 20h8v24h-8z' fill='%23F6F7F9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root{
    --bg:#F6F7F9;
    --ink:#1B2229;
    --ink-soft:#5A6672;
    --ink-faint:#8A94A0;
    --line:#E2E6EB;
    --accent:#0E7C86;
    --accent-deep:#0A5E66;
    --card:#FFFFFF;
    --code-bg:#F0F2F5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px;line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:760px;margin:0 auto;padding:0 24px;}

  /* ===== 顶部导航 ===== */
  header.site-nav{
    position:sticky;top:0;z-index:20;
    background:rgba(246,247,249,.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:760px;margin:0 auto;padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{
    font-family:"Space Grotesk","Noto Sans SC",sans-serif;
    font-weight:700;font-size:18px;color:var(--ink);
    text-decoration:none;display:flex;align-items:center;gap:8px;
  }
  .brand svg{width:20px;height:20px;flex:none;}
  .nav-links{display:flex;gap:22px;list-style:none;}
  .nav-links a{color:var(--ink-soft);text-decoration:none;font-size:14.5px;transition:color .18s;}
  .nav-links a:hover{color:var(--accent);}
  .nav-links a.active{color:var(--accent);font-weight:500;}

  /* ===== 视图容器 ===== */
  .view{display:none;}
  .view.active{display:block;}

  /* ===== 列表视图 ===== */
  .list-head{padding:72px 0 40px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .list-head h1{
    font-family:"Space Grotesk","Noto Sans SC",sans-serif;
    font-size:clamp(38px,7vw,56px);font-weight:700;letter-spacing:-.02em;line-height:1.1;
  }
  .list-head h1 .dot{color:var(--accent);}
  .list-head p{color:var(--ink-soft);font-size:15px;margin-top:14px;font-weight:300;}
  .post-list{list-style:none;}
  .post-item{border-bottom:1px solid var(--line);}
  .post-item a{display:block;padding:26px 4px;text-decoration:none;transition:padding-left .18s ease;}
  .post-item a:hover{padding-left:12px;}
  .post-meta{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:13px;}
  .post-meta .tag{
    background:rgba(14,124,134,.08);color:var(--accent-deep);
    padding:1px 10px;border-radius:999px;font-size:12px;
  }
  .post-title{font-size:19px;font-weight:700;color:var(--ink);margin-top:8px;}
  .post-summary{color:var(--ink-soft);font-size:14.5px;margin-top:6px;}
  .post-item a:hover .post-title{color:var(--accent);}
  .list-tip{
    padding:30px 4px;color:var(--ink-faint);font-size:14px;line-height:1.9;
  }
  .list-tip code{
    font-family:Consolas,"SF Mono",monospace;font-size:13px;
    background:var(--code-bg);padding:2px 7px;border-radius:5px;color:var(--accent-deep);
  }

  /* ===== 文章视图 ===== */
  .post-head{padding:64px 0 8px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--ink-faint);text-decoration:none;font-size:14px;
    margin-bottom:28px;transition:color .18s;
  }
  .back-link:hover{color:var(--accent);}
  .post-head h1{font-size:clamp(26px,5vw,34px);font-weight:700;letter-spacing:-.01em;line-height:1.35;}
  .post-head .meta{color:var(--ink-faint);font-size:13.5px;margin-top:14px;}
  .markdown-body{margin-top:36px;padding-bottom:64px;color:var(--ink);}
  .markdown-body>*{margin-bottom:18px;}
  .markdown-body h2{
    font-size:22px;font-weight:700;margin-top:40px;padding-bottom:8px;
    border-bottom:1px solid var(--line);letter-spacing:-.01em;
  }
  .markdown-body h3{font-size:18px;font-weight:700;margin-top:28px;}
  .markdown-body p{color:var(--ink-soft);}
  .markdown-body a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(14,124,134,.35);}
  .markdown-body a:hover{border-color:var(--accent);}
  .markdown-body ul,.markdown-body ol{padding-left:26px;color:var(--ink-soft);}
  .markdown-body li{margin-bottom:6px;}
  .markdown-body blockquote{
    border-left:3px solid var(--accent);background:rgba(14,124,134,.05);
    padding:12px 18px;border-radius:0 8px 8px 0;color:var(--ink-soft);font-size:15px;
  }
  .markdown-body code{
    font-family:Consolas,"SF Mono","JetBrains Mono",monospace;font-size:13.5px;
    background:var(--code-bg);padding:2px 7px;border-radius:5px;color:#C0362C;
  }
  .markdown-body pre{
    background:var(--code-bg);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;overflow-x:auto;margin-bottom:22px;
  }
  .markdown-body pre code{background:none;padding:0;color:inherit;font-size:13.5px;line-height:1.65;}
  .markdown-body table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:14.5px;}
  .markdown-body th,.markdown-body td{border:1px solid var(--line);padding:9px 14px;text-align:left;}
  .markdown-body th{background:#EEF1F4;font-weight:600;}
  .markdown-body hr{border:none;border-top:1px solid var(--line);margin:32px 0;}
  .post-error{color:var(--ink-faint);font-size:14.5px;padding:20px 0 60px;line-height:1.9;}

  /* ===== 关于视图 ===== */
  .about-head{padding:80px 0 16px;}
  .about-head h1{font-size:30px;font-weight:700;}
  .about-body p{color:var(--ink-soft);margin-top:20px;max-width:620px;}

  /* ===== Footer ===== */
  footer{padding:28px 0 48px;border-top:1px solid var(--line);}
  .foot-inner{
    max-width:760px;margin:0 auto;padding:22px 24px 0;
    display:flex;justify-content:space-between;align-items:center;
    color:var(--ink-faint);font-size:13px;flex-wrap:wrap;gap:8px;
  }
  .foot-inner a{color:var(--ink-faint);text-decoration:none;}
  .foot-inner a:hover{color:var(--accent);}

  @media(max-width:640px){
    .list-head{padding:52px 0 32px;}
    .post-head{padding:44px 0 4px;}
    .post-item a{padding:22px 2px;}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="#/" aria-label="返回首页">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#0E7C86"/><path d="M18 20h8v24h-8zM26 32l14 12h-8l-10-9zM38 20h8v24h-8z" fill="#F6F7F9"/></svg>
      einsdada
    </a>
    <ul class="nav-links">
      <li><a href="#/" data-nav="home">文章</a></li>
      <li><a href="#/about" data-nav="about">关于</a></li>
    </ul>
  </div>
</header>

<main class="wrap">
  <!-- ===== 列表视图 ===== -->
  <div class="view" id="view-home">
    <div class="list-head">
      <h1>einsdada<span class="dot">.</span></h1>
      <p>记录、整理与分享。这里会陆续发布文章。</p>
    </div>
    <ul class="post-list" id="post-list"></ul>
  </div>

  <!-- ===== 文章视图 ===== -->
  <div class="view" id="view-post">
    <div class="post-head">
      <a class="back-link" href="#/">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg>
        返回文章列表
      </a>
      <h1 id="post-title"></h1>
      <div class="meta" id="post-meta"></div>
    </div>
    <article class="markdown-body" id="post-body"></article>
  </div>

  <!-- ===== 关于视图 ===== -->
  <div class="view" id="view-about">
    <div class="about-head">
      <h1>关于</h1>
    </div>
    <div class="about-body">
      <p>这里是 einsdada 的个人博客，用于记录学习、项目与想法。</p>
      <p>关于我的详细介绍会陆续补充到这里。</p>
    </div>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <span>© 2026 einsdada</span>
    <a href="https://github.com/einsdada/einsdada.github.io" target="_blank" rel="noopener">本站源码</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
  var views = { home:document.getElementById("view-home"), post:document.getElementById("view-post"), about:document.getElementById("view-about") };
  var listEl = document.getElementById("post-list");
  var titleEl = document.getElementById("post-title");
  var metaEl = document.getElementById("post-meta");
  var bodyEl = document.getElementById("post-body");

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function showView(name){
    Object.keys(views).forEach(function(k){ views[k].classList.toggle("active", k === name); });
    document.querySelectorAll(".nav-links a").forEach(function(a){
      a.classList.toggle("active", a.getAttribute("data-nav") === name);
    });
    window.scrollTo(0,0);
  }

  /* ===== 读取文本：缓存 + 失败重试 + 超时（借鉴 HowToLiveBetter 的健壮加载） ===== */
  var CACHE = new Map();
  function readText(path, tries){
    if(CACHE.has(path)) return Promise.resolve(CACHE.get(path));
    var opts = { cache:"no-cache" };
    if(window.AbortSignal && AbortSignal.timeout) opts.signal = AbortSignal.timeout(20000);
    return fetch(path, opts).then(function(r){
      if(!r.ok) throw new Error("http " + r.status + "：" + path);
      return r.text();
    }).then(function(t){
      CACHE.set(path, t);
      return t;
    }).catch(function(err){
      if(tries > 1){
        return new Promise(function(res){ setTimeout(res, 400); }).then(function(){
          return readText(path, tries - 1);
        });
      }
      throw err;
    });
  }

  function parseFrontMatter(raw){
    var meta = {}, content = raw;
    var m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    if(m){
      m[1].split(/\r?\n/).forEach(function(line){
        var i = line.indexOf(":");
        if(i > 0) meta[line.slice(0,i).trim()] = line.slice(i+1).trim();
      });
      content = m[2];
    }
    return { meta: meta, content: content };
  }

  /* ===== 列表：读 posts/README.md 自动发现文章 ===== */
  function renderHome(){
    listEl.innerHTML = '<li class="post-item"><div class="post-summary">正在加载文章列表…</div></li>';
    readText("posts/README.md", 3)
      .then(function(rd){
        var files = (rd.match(/\]\(([^)\s]+\.md)\)/g) || []).map(function(s){ return s.slice(2, -1); });
        files = Array.from(new Set(files)).sort();
        if(!files.length) throw new Error("empty");
        return Promise.all(files.map(function(f){
          return readText("posts/" + f, 3).then(function(t){
            var p = parseFrontMatter(t);
            return { slug: f.replace(/\.md$/, ""), title: p.meta.title || f, date: p.meta.date || "", tag: p.meta.tag || "", summary: p.meta.summary || "" };
          });
        }));
      })
      .then(function(posts){
        posts.sort(function(a, b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
        if(!posts.length){
          listEl.innerHTML = '<li class="post-item"><div class="post-summary">还没有文章，敬请期待。</div></li>';
          return;
        }
        listEl.innerHTML = posts.map(function(p){
          return '<li class="post-item"><a href="#/post/' + esc(p.slug) + '">' +
            '<div class="post-meta"><span>' + esc(p.date) + '</span>' +
            (p.tag ? '<span class="tag">' + esc(p.tag) + '</span>' : '') + '</div>' +
            '<div class="post-title">' + esc(p.title) + '</div>' +
            (p.summary ? '<div class="post-summary">' + esc(p.summary) + '</div>' : '') +
            '</a></li>';
        }).join("");
      })
      .catch(function(err){
        var tip = (err && err.message === "empty")
          ? '文章列表为空：请在 <code>posts/README.md</code> 里添加文章链接。'
          : '文章列表加载失败。<br><br>原因通常是直接双击打开了 HTML 文件（file:// 下浏览器禁止读取数据文件）。<br>请用本地服务器预览：在仓库目录运行 <code>python -m http.server 8000</code>，然后访问 <code>http://localhost:8000</code>。';
        listEl.innerHTML = '<li class="post-item"><div class="list-tip">' + tip + '</div></li>';
      });
  }

  /* ===== 文章：读取 posts/<slug>.md 并渲染 ===== */
  function renderPost(slug){
    titleEl.textContent = "加载中…";
    metaEl.textContent = "";
    bodyEl.innerHTML = "";
    readText("posts/" + encodeURIComponent(slug) + ".md", 3)
      .then(function(raw){
        var p = parseFrontMatter(raw);
        titleEl.textContent = p.meta.title || slug;
        metaEl.textContent = (p.meta.date || "") + (p.meta.tag ? " · " + p.meta.tag : "");
        bodyEl.innerHTML = marked.parse(p.content);
        if(window.hljs){
          bodyEl.querySelectorAll("pre code").forEach(function(block){ hljs.highlightElement(block); });
        }
      })
      .catch(function(){
        titleEl.textContent = "文章加载失败";
        metaEl.textContent = "";
        bodyEl.innerHTML = '<p class="post-error">无法读取文章文件 posts/' + esc(slug) + '.md。<br>本地预览请通过 HTTP 服务器打开（python -m http.server），线上访问则不受影响。</p>';
      });
  }

  function route(){
    var h = location.hash || "#/";
    if(h.indexOf("#/post/") === 0){
      renderPost(decodeURIComponent(h.slice(7)));
      showView("post");
    } else if(h === "#/about"){
      showView("about");
    } else {
      renderHome();
      showView("home");
    }
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
